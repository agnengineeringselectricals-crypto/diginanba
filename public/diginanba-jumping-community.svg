<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 190" role="img" aria-labelledby="title desc">
<title id="title">DigiNanba happy jumping community</title><desc id="desc">Nine smiling hand-drawn people, including grandparents, jump in a loop. Only the letters spelling DigiNanba are colored; a few people hold outlined cash.</desc>
<defs><style>
.line{fill:none;stroke:#666;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.shirt{fill:#fff;stroke:#666;stroke-width:2.5;stroke-linejoin:round}.face{fill:#fff;stroke:#666;stroke-width:2.5}.letter{font:900 39px Arial,sans-serif;text-anchor:middle}.cash{fill:#fff;stroke:#777;stroke-width:2;stroke-linejoin:round}.motion{fill:none;stroke:#aaa;stroke-width:2;stroke-linecap:round}
</style>
<g id="person">
<path class="line" d="M-13 46 Q-25 39 -30 28 M13 46 Q25 39 30 28"/>
<path class="shirt" d="M-19 42 L-30 48 L-24 78 L24 78 L30 48 L19 42 Q0 50 -19 42Z"/>
<path class="line" d="M-12 78 L-15 98 L-25 109 M12 78 L15 98 L25 108"/>
<path class="face" d="M-18 12 Q-20 -8 0 -10 Q20 -8 18 12 L14 28 Q0 42 -14 28Z"/>
<path class="line" d="M-10 14 l2 1 M8 14 l2 1 M-8 25 Q0 32 8 25"/>
</g>
</defs>
<rect width="1260" height="190" fill="#fff"/>
<path class="line" d="M18 157 Q630 164 1242 157"/>
