    <rect x="5" y="30" width="5" height="5" fill="#06C8E8"/>
    <rect x="14" y="31" width="5" height="5" fill="#06C8E8"/>
    <rect x="14" y="38" width="5" height="5" fill="#06C8E8"/>
    <rect x="21" y="36" width="5" height="5" fill="#06C8E8"/>
    <rect x="21" y="29" width="5" height="5" fill="#06C8E8"/>
  </g>
  <text x="59" y="34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" letter-spacing="-1.15" fill="#0B1538">Digi</text>
  <text x="110" y="34" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" letter-spacing="-1.15" fill="url(#nanba-gradient)">Nanba</text>
  <path d="M111 40h103" stroke="url(#nanba-gradient)" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
