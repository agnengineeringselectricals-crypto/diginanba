<svg xmlns="http://www.w3.org/2000/svg" width="268" height="52" viewBox="0 0 268 52" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">DigiNanba</title>
  <desc id="logo-desc">DigiNanba wordmark with a navy D and cyan pixel accents to its left.</desc>
  <defs>
    <linearGradient id="nanba-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- The standalone D symbol follows the uploaded navy-and-cyan pixel mark. -->
